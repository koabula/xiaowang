<svg viewBox="0 0 1160 920" width="1160" height="920" role="img" aria-label="LLM + Realtime architecture" xmlns="http://www.w3.org/2000/svg"><title>LLM + Realtime architecture</title><desc>The application coordinates voice, background research and workspace state</desc><style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  .title { font-size: 27px; font-weight: 650; fill: #203453; letter-spacing: -.5px; }
  .subtitle { font-size: 15px; fill: #6b7c94; }
  .footer { font-size: 12px; fill: #8593a8; }
  .wire { fill: none; stroke: #6683be; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .wire.data { stroke: #5e9295; stroke-dasharray: 5 5; }
  .wire.direct { stroke: #a68155; stroke-dasharray: 2 5; }
  .edge-label { font-size: 12px; fill: #7a889f; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 7px; stroke-linejoin: round; }
  .node { cursor: pointer; outline: none; }
  .node rect { fill: #f7f9fd; stroke: #d8e2f1; stroke-width: 1.2; }
  .node .accent { fill: #2b59c3; stroke: none; }
  .node.teal rect { fill: #f2f8f7; stroke: #d0e4e0; }
  .node.teal .accent { fill: #428c83; }
  .node.orange rect { fill: #fdf8f2; stroke: #eddcc7; }
  .node.orange .accent { fill: #b77b38; }
  .node .node-title { fill: #263f63; font-size: 19px; font-weight: 600; }
  .node .node-line { fill: #71829b; font-size: 13px; }
  .node.selected rect, .node:focus-visible rect { stroke: #2b59c3; stroke-width: 2.5; fill: #edf3ff; }
  .node.selected .node-title { fill: #234fae; }
  .node.dim, .edge.dim { opacity: .2; }
  .node.selected.dim { opacity: 1; }
  .edge.active .wire { stroke: #2b59c3; stroke-width: 2.8; }
  .lane-label { font-size: 12px; fill: #71829b; font-weight: 550; }
  .node.slice .surface { fill: #dce7fc; stroke: #aac1ed; stroke-width: 1.3; }
  .node.slice .cap { fill: #edf3ff; stroke: #aac1ed; stroke-width: 1.3; }
  .node.slice.teal .surface { fill: #dbeeea; stroke: #a6cdc3; }
  .node.slice.teal .cap { fill: #f0f9f6; stroke: #a6cdc3; }
  .node.slice.orange .surface { fill: #f6e4ce; stroke: #dcb78b; }
  .node.slice.orange .cap { fill: #fdf5e9; stroke: #dcb78b; }
  .node.slice.selected .surface, .node.slice.selected .cap, .node.slice:focus-visible .cap { stroke: #2b59c3; stroke-width: 3; }
  .node.point circle { fill: #2b59c3; stroke: white; stroke-width: 4; }
  .node.point.orange circle { fill: #c78543; }
  .node.point.teal circle { fill: #428c83; }
  .node.point.selected circle, .node.point:focus-visible circle { stroke: #95b6ff; stroke-width: 6; }
  .node.prefix.selected .row-label, .node.prefix:focus-visible .row-label { fill: #2b59c3; font-weight: 650; }
  .segment-text { font-size: 16px; font-weight: 550; fill: #35527e; text-anchor: middle; }
  .point-label { font-size: 16px; font-weight: 650; fill: #3d587e; text-anchor: middle; }
  .annotation { font-size: 13px; fill: #71829b; }
</style><rect width="1160" height="920" fill="#ffffff"/><defs><marker id="overview-control" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#6683be" stroke-width="1.6"/></marker><marker id="overview-data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#5e9295" stroke-width="1.6"/></marker><marker id="overview-direct" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a68155" stroke-width="1.6"/></marker></defs><text x="40" y="48" class="title">LLM + Realtime architecture</text><text x="40" y="78" class="subtitle">The application coordinates voice, background research and workspace state</text><path d="M40 105H1120" stroke="#e8edf5" stroke-width="1"/><text x="40" y="130" class="lane-label">User and renderer</text><text x="345" y="130" class="lane-label">Coordination · Electron main</text><text x="765" y="130" class="lane-label">Providers and tool execution</text><g class="edge" data-from="audio" data-to="call"><path class="wire control" d="M275 184H345" marker-end="url(#overview-control)"/><text class="edge-label" x="310" y="174">PCM</text></g><g class="edge" data-from="call" data-to="audio"><path class="wire control" d="M345 221H275" marker-end="url(#overview-control)"/><text class="edge-label" x="310" y="239">Audio</text></g><g class="edge" data-from="call" data-to="realtime"><path class="wire control" d="M645 184H765" marker-end="url(#overview-control)"/><text class="edge-label" x="705" y="174">WebSocket</text></g><g class="edge" data-from="realtime" data-to="call"><path class="wire control" d="M765 221H645" marker-end="url(#overview-control)"/><text class="edge-label" x="705" y="239">Audio / events</text></g><g class="edge" data-from="text" data-to="queue"><path class="wire control" d="M275 415H345" marker-end="url(#overview-control)"/><text class="edge-label" x="310" y="400">Input</text></g><g class="edge" data-from="call" data-to="queue"><path class="wire control" d="M432 250V365" marker-end="url(#overview-control)"/><text class="edge-label" x="431" y="304">Delegate / supplement</text></g><g class="edge" data-from="queue" data-to="call"><path class="wire control" d="M563 365V250" marker-end="url(#overview-control)"/><text class="edge-label" x="564" y="325">Progress / result</text></g><g class="edge" data-from="queue" data-to="llm"><path class="wire control" d="M645 397H765" marker-end="url(#overview-control)"/><text class="edge-label" x="705" y="385">Model request</text></g><g class="edge" data-from="llm" data-to="queue"><path class="wire control" d="M765 438H645" marker-end="url(#overview-control)"/><text class="edge-label" x="705" y="457">Text / tool calls</text></g><g class="edge" data-from="queue" data-to="tools"><path class="wire control" d="M645 447H730V605H765" marker-end="url(#overview-control)"/><text class="edge-label" x="730" y="523">Run tools</text></g><g class="edge" data-from="tools" data-to="queue"><path class="wire control" d="M765 625H703V486H610V465" marker-end="url(#overview-control)"/><text class="edge-label" x="704" y="552">Tool results</text></g><g class="edge" data-from="call" data-to="tools"><path class="wire direct" d="M645 204H684V550H1035V580" marker-end="url(#overview-direct)"/><text class="edge-label" x="684" y="290">Direct tools</text></g><g class="edge" data-from="tools" data-to="view"><path class="wire direct" d="M765 663H735V717H159V680" marker-end="url(#overview-direct)"/><text class="edge-label" x="448" y="719">View / browser drivers</text></g><g class="edge" data-from="view" data-to="shared"><path class="wire data" d="M275 630H345" marker-end="url(#overview-data)"/><text class="edge-label" x="310" y="614">Page</text></g><g class="edge" data-from="shared" data-to="call"><path class="wire data" d="M345 607H314V286H374V250" marker-end="url(#overview-data)"/><text class="edge-label" x="315" y="521">Shared state</text></g><g class="edge" data-from="shared" data-to="queue"><path class="wire data" d="M493 580V465" marker-end="url(#overview-data)"/><text class="edge-label" x="493" y="548">Task snapshots</text></g><g class="edge" data-from="shared" data-to="store"><path class="wire data" d="M493 680V770" marker-end="url(#overview-data)"/><text class="edge-label" x="493" y="746">State events</text></g><g class="edge" data-from="queue" data-to="store"><path class="wire data" d="M645 420H670V815H645" marker-end="url(#overview-data)"/><text class="edge-label" x="670" y="754">Append events</text></g><g class="edge" data-from="tools" data-to="files"><path class="wire data" d="M940 680V770" marker-end="url(#overview-data)"/><text class="edge-label" x="940" y="747">Save / reference</text></g><g class="edge" data-from="files" data-to="tools"><path class="wire data" d="M1045 770V680" marker-end="url(#overview-data)"/><text class="edge-label" x="1045" y="721">Read sources</text></g><g class="edge" data-from="store" data-to="queue"><path class="wire data" d="M345 815H295V486H370V465" marker-end="url(#overview-data)"/><text class="edge-label" x="297" y="777">Read history</text></g><g class="node blue " data-node="audio" aria-label="Voice input and playback"><rect x="40" y="150" width="235" height="100" rx="9"/><rect class="accent" x="40" y="170" width="3" height="60" rx="1.5"/><text class="node-title" x="60" y="183" style="font-size: 16.7936px;">Voice input and playback</text><text class="node-line" x="60" y="208">Microphone PCM · Web Audio</text><text class="node-line" x="60" y="228" style="font-size: 12.0854px;">Playback position and idle receipts</text></g><g class="node blue" data-node="call" aria-label="Call coordination"><rect x="345" y="150" width="300" height="100" rx="9"/><rect class="accent" x="345" y="170" width="3" height="60" rx="1.5"/><text class="node-title" x="365" y="183">Call coordination</text><text class="node-line" x="365" y="208">State · tool routing · barge-in</text><text class="node-line" x="365" y="228">Playback receipts · notifications</text></g><g class="node blue " data-node="realtime" aria-label="Realtime model"><rect x="765" y="150" width="350" height="100" rx="9"/><rect class="accent" x="765" y="170" width="3" height="60" rx="1.5"/><text class="node-title" x="785" y="183">Realtime model</text><text class="node-line" x="785" y="208">Gemini · OpenAI · Qwen · Doubao</text><text class="node-line" x="785" y="228">32K active-window target</text></g><g class="node blue " data-node="text" aria-label="Text and attachments"><rect x="40" y="365" width="235" height="100" rx="9"/><rect class="accent" x="40" y="385" width="3" height="60" rx="1.5"/><text class="node-title" x="60" y="398">Text and attachments</text><text class="node-line" x="60" y="423">Messages · images · source refs</text><text class="node-line" x="60" y="443">Supplement / queue new task</text></g><g class="node blue " data-node="queue" aria-label="Queue and Agent loop"><rect x="345" y="365" width="300" height="100" rx="9"/><rect class="accent" x="345" y="385" width="3" height="60" rx="1.5"/><text class="node-title" x="365" y="398">Queue and Agent loop</text><text class="node-line" x="365" y="423">JobQueue → runTurn</text><text class="node-line" x="365" y="443">128K target · model-aware limits</text></g><g class="node blue " data-node="llm" aria-label="Background LLM"><rect x="765" y="365" width="350" height="100" rx="9"/><rect class="accent" x="765" y="385" width="3" height="60" rx="1.5"/><text class="node-title" x="785" y="398">Background LLM</text><text class="node-line" x="785" y="423">OpenAI-compatible / Anthropic APIs</text><text class="node-line" x="785" y="443">Streaming text and tool calls</text></g><g class="node blue " data-node="view" aria-label="Documents and views"><rect x="40" y="580" width="235" height="100" rx="9"/><rect class="accent" x="40" y="600" width="3" height="60" rx="1.5"/><text class="node-title" x="60" y="613">Documents and views</text><text class="node-line" x="60" y="638">PDF.js · HTML Canvas</text><text class="node-line" x="60" y="658" style="font-size: 12.2688px;">Page position and display receipts</text></g><g class="node teal " data-node="shared" aria-label="Per-bot shared context"><rect x="345" y="580" width="300" height="100" rx="9"/><rect class="accent" x="345" y="600" width="3" height="60" rx="1.5"/><text class="node-title" x="365" y="613">Per-bot shared context</text><text class="node-line" x="365" y="638">Current message · page · recent jobs</text><text class="node-line" x="365" y="658">revision / viewRevision</text></g><g class="node blue " data-node="tools" aria-label="Tools and UI drivers"><rect x="765" y="580" width="350" height="100" rx="9"/><rect class="accent" x="765" y="600" width="3" height="60" rx="1.5"/><text class="node-title" x="785" y="613">Tools and UI drivers</text><text class="node-line" x="785" y="638">Sources · files · reader · browser</text><text class="node-line" x="785" y="658">show_stage · spawn_bot</text></g><g class="node teal " data-node="store" aria-label="SQLite events and metadata"><rect x="345" y="770" width="300" height="90" rx="9"/><rect class="accent" x="345" y="790" width="3" height="50" rx="1.5"/><text class="node-title" x="365" y="803">SQLite events and metadata</text><text class="node-line" x="365" y="828">Messages · job state · source refs</text></g><g class="node teal " data-node="files" aria-label="Library and workspace"><rect x="765" y="770" width="350" height="90" rx="9"/><rect class="accent" x="765" y="790" width="3" height="50" rx="1.5"/><text class="node-title" x="785" y="803">Library and workspace</text><text class="node-line" x="785" y="828">Originals · notes · HTML artifacts</text></g><path class="wire control" d="M40 890h28"/><text class="footer" x="79" y="895">Control / model calls</text><path class="wire data" d="M275 890h28"/><text class="footer" x="314" y="895">Context / persistence</text><path class="wire direct" d="M510 890h28"/><text class="footer" x="549" y="895">Direct tools / queue</text><text class="footer" x="1120" y="895" text-anchor="end">XiaoWang · v0.1.19</text></svg>