<svg viewBox="0 0 1160 850" width="1160" height="850" role="img" aria-label="Context assembly and memory sources" xmlns="http://www.w3.org/2000/svg"><title>Context assembly and memory sources</title><desc>Background requests and live calls receive different projections of shared evidence</desc><style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  .title { font-size: 27px; font-weight: 650; fill: #203453; letter-spacing: -.5px; }
  .subtitle { font-size: 15px; fill: #6b7c94; }
  .footer { font-size: 12px; fill: #8593a8; }
  .wire { fill: none; stroke: #6683be; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .wire.data { stroke: #5e9295; stroke-dasharray: 5 5; }
  .wire.direct { stroke: #a68155; stroke-dasharray: 2 5; }
  .edge-label { font-size: 12px; fill: #7a889f; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 7px; stroke-linejoin: round; }
  .node { cursor: pointer; outline: none; }
  .node rect { fill: #f7f9fd; stroke: #d8e2f1; stroke-width: 1.2; }
  .node .accent { fill: #2b59c3; stroke: none; }
  .node.teal rect { fill: #f2f8f7; stroke: #d0e4e0; }
  .node.teal .accent { fill: #428c83; }
  .node.orange rect { fill: #fdf8f2; stroke: #eddcc7; }
  .node.orange .accent { fill: #b77b38; }
  .node .node-title { fill: #263f63; font-size: 19px; font-weight: 600; }
  .node .node-line { fill: #71829b; font-size: 13px; }
  .node.selected rect, .node:focus-visible rect { stroke: #2b59c3; stroke-width: 2.5; fill: #edf3ff; }
  .node.selected .node-title { fill: #234fae; }
  .node.dim, .edge.dim { opacity: .2; }
  .node.selected.dim { opacity: 1; }
  .edge.active .wire { stroke: #2b59c3; stroke-width: 2.8; }
  .lane-label { font-size: 12px; fill: #71829b; font-weight: 550; }
  .node.slice .surface { fill: #dce7fc; stroke: #aac1ed; stroke-width: 1.3; }
  .node.slice .cap { fill: #edf3ff; stroke: #aac1ed; stroke-width: 1.3; }
  .node.slice.teal .surface { fill: #dbeeea; stroke: #a6cdc3; }
  .node.slice.teal .cap { fill: #f0f9f6; stroke: #a6cdc3; }
  .node.slice.orange .surface { fill: #f6e4ce; stroke: #dcb78b; }
  .node.slice.orange .cap { fill: #fdf5e9; stroke: #dcb78b; }
  .node.slice.selected .surface, .node.slice.selected .cap, .node.slice:focus-visible .cap { stroke: #2b59c3; stroke-width: 3; }
  .node.point circle { fill: #2b59c3; stroke: white; stroke-width: 4; }
  .node.point.orange circle { fill: #c78543; }
  .node.point.teal circle { fill: #428c83; }
  .node.point.selected circle, .node.point:focus-visible circle { stroke: #95b6ff; stroke-width: 6; }
  .node.prefix.selected .row-label, .node.prefix:focus-visible .row-label { fill: #2b59c3; font-weight: 650; }
  .segment-text { font-size: 16px; font-weight: 550; fill: #35527e; text-anchor: middle; }
  .point-label { font-size: 16px; font-weight: 650; fill: #3d587e; text-anchor: middle; }
  .annotation { font-size: 13px; fill: #71829b; }
</style><rect width="1160" height="850" fill="#ffffff"/><defs><marker id="context-control" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#6683be" stroke-width="1.6"/></marker><marker id="context-data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#5e9295" stroke-width="1.6"/></marker><marker id="context-direct" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a68155" stroke-width="1.6"/></marker></defs><text x="40" y="48" class="title">Context assembly and memory sources</text><text x="40" y="78" class="subtitle">Background requests and live calls receive different projections of shared evidence</text><path d="M40 105H1120" stroke="#e8edf5" stroke-width="1"/><g class="edge" data-from="history" data-to="projection"><path class="wire data" d="M140 260V330H240V420" marker-end="url(#context-data)"/></g><g class="edge" data-from="identity" data-to="projection"><path class="wire data" d="M414 260V353H340V420" marker-end="url(#context-data)"/></g><g class="edge" data-from="references" data-to="projection"><path class="wire data" d="M695 260V376H445V420" marker-end="url(#context-data)"/></g><g class="edge" data-from="workspace" data-to="projection"><path class="wire data" d="M975 260V399H520V420" marker-end="url(#context-data)"/></g><g class="edge" data-from="history" data-to="brief"><path class="wire data" d="M195 260V300H675V420" marker-end="url(#context-data)"/></g><g class="edge" data-from="identity" data-to="brief"><path class="wire data" d="M470 260V323H780V420" marker-end="url(#context-data)"/></g><g class="edge" data-from="references" data-to="brief"><path class="wire data" d="M752 260V346H890V420" marker-end="url(#context-data)"/></g><g class="edge" data-from="workspace" data-to="brief"><path class="wire data" d="M1030 260V420" marker-end="url(#context-data)"/></g><g class="edge" data-from="projection" data-to="request"><path class="wire control" d="M302 550V665" marker-end="url(#context-control)"/><text class="edge-label" x="302" y="615">Before each model call</text></g><g class="edge" data-from="brief" data-to="session"><path class="wire control" d="M862 550V665" marker-end="url(#context-control)"/><text class="edge-label" x="862" y="615">Call start / updates</text></g><g class="node teal " data-node="history" aria-label="Conversation events"><rect x="40" y="150" width="245" height="110" rx="9"/><rect class="accent" x="40" y="170" width="3" height="70" rx="1.5"/><text class="node-title" x="60" y="183">Conversation events</text><text class="node-line" x="60" y="208">Inputs · outputs · tools · revisions</text></g><g class="node teal " data-node="identity" aria-label="Identity and task"><rect x="320" y="150" width="245" height="110" rx="9"/><rect class="accent" x="320" y="170" width="3" height="70" rx="1.5"/><text class="node-title" x="340" y="183">Identity and task</text><text class="node-line" x="340" y="208">Persona · goal · terminology</text></g><g class="node teal " data-node="references" aria-label="Sources and artifacts"><rect x="600" y="150" width="245" height="110" rx="9"/><rect class="accent" x="600" y="170" width="3" height="70" rx="1.5"/><text class="node-title" x="620" y="183">Sources and artifacts</text><text class="node-line" x="620" y="208">Library refs · files · notes</text></g><g class="node teal " data-node="workspace" aria-label="Shared workspace state"><rect x="880" y="150" width="245" height="110" rx="9"/><rect class="accent" x="880" y="170" width="3" height="70" rx="1.5"/><text class="node-title" x="900" y="183" style="font-size: 18.2637px;">Shared workspace state</text><text class="node-line" x="900" y="208">Visible page · attachments · jobs</text></g><g class="node blue" data-node="projection" aria-label="Background assembly"><rect x="40" y="420" width="525" height="130" rx="9"/><rect class="accent" x="40" y="440" width="3" height="90" rx="1.5"/><text class="node-title" x="60" y="453">Background assembly</text><text class="node-line" x="60" y="478">Stable prefix · event projection</text><text class="node-line" x="60" y="498">Task state · supplements · images</text></g><g class="node blue " data-node="brief" aria-label="Realtime assembly"><rect x="600" y="420" width="525" height="130" rx="9"/><rect class="accent" x="600" y="440" width="3" height="90" rx="1.5"/><text class="node-title" x="620" y="453">Realtime assembly</text><text class="node-line" x="620" y="478">Initial brief · ongoing updates</text><text class="node-line" x="620" y="498">Current page · bounded job results</text></g><g class="node blue " data-node="request" aria-label="Background request"><rect x="40" y="665" width="525" height="100" rx="9"/><rect class="accent" x="40" y="685" width="3" height="60" rx="1.5"/><text class="node-title" x="60" y="698">Background request</text><text class="node-line" x="60" y="723">system + tools + messages</text><text class="node-line" x="60" y="743">128K target, capped by model limits</text></g><g class="node blue " data-node="session" aria-label="Live call session"><rect x="600" y="665" width="525" height="100" rx="9"/><rect class="accent" x="600" y="685" width="3" height="60" rx="1.5"/><text class="node-title" x="620" y="698">Live call session</text><text class="node-line" x="620" y="723">Voice · native tools · page frames</text><text class="node-line" x="620" y="743">32K active-window target</text></g><path class="wire control" d="M40 820h28"/><text class="footer" x="79" y="825">Control / model calls</text><path class="wire data" d="M275 820h28"/><text class="footer" x="314" y="825">Context / persistence</text><path class="wire direct" d="M510 820h28"/><text class="footer" x="549" y="825">Direct tools / queue</text><text class="footer" x="1120" y="825" text-anchor="end">XiaoWang · v0.1.19</text></svg>