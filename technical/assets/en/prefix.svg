<svg viewBox="0 0 1160 850" width="1160" height="850" role="img" aria-label="Stable prefixes across requests" xmlns="http://www.w3.org/2000/svg"><title>Stable prefixes across requests</title><desc>Append within an epoch; rebuild selected history at budget boundaries</desc><style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  .title { font-size: 27px; font-weight: 650; fill: #203453; letter-spacing: -.5px; }
  .subtitle { font-size: 15px; fill: #6b7c94; }
  .footer { font-size: 12px; fill: #8593a8; }
  .wire { fill: none; stroke: #6683be; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .wire.data { stroke: #5e9295; stroke-dasharray: 5 5; }
  .wire.direct { stroke: #a68155; stroke-dasharray: 2 5; }
  .edge-label { font-size: 12px; fill: #7a889f; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 7px; stroke-linejoin: round; }
  .node { cursor: pointer; outline: none; }
  .node rect { fill: #f7f9fd; stroke: #d8e2f1; stroke-width: 1.2; }
  .node .accent { fill: #2b59c3; stroke: none; }
  .node.teal rect { fill: #f2f8f7; stroke: #d0e4e0; }
  .node.teal .accent { fill: #428c83; }
  .node.orange rect { fill: #fdf8f2; stroke: #eddcc7; }
  .node.orange .accent { fill: #b77b38; }
  .node .node-title { fill: #263f63; font-size: 19px; font-weight: 600; }
  .node .node-line { fill: #71829b; font-size: 13px; }
  .node.selected rect, .node:focus-visible rect { stroke: #2b59c3; stroke-width: 2.5; fill: #edf3ff; }
  .node.selected .node-title { fill: #234fae; }
  .node.dim, .edge.dim { opacity: .2; }
  .node.selected.dim { opacity: 1; }
  .edge.active .wire { stroke: #2b59c3; stroke-width: 2.8; }
  .lane-label { font-size: 12px; fill: #71829b; font-weight: 550; }
  .node.slice .surface { fill: #dce7fc; stroke: #aac1ed; stroke-width: 1.3; }
  .node.slice .cap { fill: #edf3ff; stroke: #aac1ed; stroke-width: 1.3; }
  .node.slice.teal .surface { fill: #dbeeea; stroke: #a6cdc3; }
  .node.slice.teal .cap { fill: #f0f9f6; stroke: #a6cdc3; }
  .node.slice.orange .surface { fill: #f6e4ce; stroke: #dcb78b; }
  .node.slice.orange .cap { fill: #fdf5e9; stroke: #dcb78b; }
  .node.slice.selected .surface, .node.slice.selected .cap, .node.slice:focus-visible .cap { stroke: #2b59c3; stroke-width: 3; }
  .node.point circle { fill: #2b59c3; stroke: white; stroke-width: 4; }
  .node.point.orange circle { fill: #c78543; }
  .node.point.teal circle { fill: #428c83; }
  .node.point.selected circle, .node.point:focus-visible circle { stroke: #95b6ff; stroke-width: 6; }
  .node.prefix.selected .row-label, .node.prefix:focus-visible .row-label { fill: #2b59c3; font-weight: 650; }
  .segment-text { font-size: 16px; font-weight: 550; fill: #35527e; text-anchor: middle; }
  .point-label { font-size: 16px; font-weight: 650; fill: #3d587e; text-anchor: middle; }
  .annotation { font-size: 13px; fill: #71829b; }
</style><rect width="1160" height="850" fill="#ffffff"/><defs><marker id="prefix-control" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#6683be" stroke-width="1.6"/></marker><marker id="prefix-data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#5e9295" stroke-width="1.6"/></marker><marker id="prefix-direct" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a68155" stroke-width="1.6"/></marker></defs><text x="40" y="48" class="title">Stable prefixes across requests</text><text x="40" y="78" class="subtitle">Append within an epoch; rebuild selected history at budget boundaries</text><path d="M40 105H1120" stroke="#e8edf5" stroke-width="1"/><g class="edge" data-from="first" data-to="second"><path class="wire control" d="M100 245V420" marker-end="url(#prefix-control)"/><text class="edge-label" x="99" y="327">Append</text></g><g class="edge" data-from="second" data-to="third"><path class="wire direct" d="M100 420V595" marker-end="url(#prefix-direct)"/><text class="edge-label" x="99" y="503">Reproject</text></g><g class="node blue prefix" data-node="first" aria-label="Request 1 · epoch 0"><text x="140" y="175" class="node-title row-label">Request 1 · epoch 0</text><rect x="140" y="197" width="165" height="63" rx="7" style="fill:#edf3ff;stroke:#c7d8f5"/><text x="222.5" y="236" class="segment-text">S + T</text><rect x="310" y="197" width="210" height="63" rx="7" style="fill:#edf3ff;stroke:#c7d8f5"/><text x="415" y="236" class="segment-text">History H₀</text><rect x="525" y="197" width="130" height="63" rx="7" style="fill:#fbecd9;stroke:#e4c7a0"/><text x="590" y="236" class="segment-text">Input U₁</text></g><g class="node blue prefix" data-node="second" aria-label="Request 2 · epoch 0"><text x="140" y="350" class="node-title row-label">Request 2 · epoch 0</text><rect x="140" y="372" width="165" height="63" rx="7" style="fill:#edf3ff;stroke:#c7d8f5"/><text x="222.5" y="411" class="segment-text">S + T</text><rect x="310" y="372" width="210" height="63" rx="7" style="fill:#edf3ff;stroke:#c7d8f5"/><text x="415" y="411" class="segment-text">History H₀</text><rect x="525" y="372" width="130" height="63" rx="7" style="fill:#edf3ff;stroke:#c7d8f5"/><text x="590" y="411" class="segment-text">Input U₁</text><rect x="660" y="372" width="130" height="63" rx="7" style="fill:#fbecd9;stroke:#e4c7a0"/><text x="725" y="411" class="segment-text">Reply A₁</text><rect x="795" y="372" width="170" height="63" rx="7" style="fill:#fbecd9;stroke:#e4c7a0"/><text x="880" y="411" class="segment-text">State / U₂</text></g><g class="node blue prefix" data-node="third" aria-label="Request 3 · epoch 1"><text x="140" y="525" class="node-title row-label">Request 3 · epoch 1</text><rect x="140" y="547" width="165" height="63" rx="7" style="fill:#edf3ff;stroke:#c7d8f5"/><text x="222.5" y="586" class="segment-text">S + T</text><rect x="310" y="547" width="230" height="63" rx="7" style="fill:#e4f2ed;stroke:#b8d9cd"/><text x="425" y="586" class="segment-text">Index I₁</text><rect x="545" y="547" width="235" height="63" rx="7" style="fill:#e4f2ed;stroke:#b8d9cd"/><text x="662.5" y="586" class="segment-text">Retained blocks</text><rect x="785" y="547" width="180" height="63" rx="7" style="fill:#fbecd9;stroke:#e4c7a0"/><text x="875" y="586" class="segment-text">Input U₃</text></g><g class="node blue " data-node="estimate" aria-label="Estimated common prefix"><rect x="140" y="690" width="440" height="100" rx="9"/><rect class="accent" x="140" y="710" width="3" height="60" rx="1.5"/><text class="node-title" x="160" y="723">Estimated common prefix</text><text class="node-line" x="160" y="748">Message fingerprints · per call</text><text class="node-line" x="160" y="768">prefixTokens ≠ actual cache hits</text></g><g class="node teal " data-node="actual" aria-label="Actual provider usage"><rect x="630" y="690" width="460" height="100" rx="9"/><rect class="accent" x="630" y="710" width="3" height="60" rx="1.5"/><text class="node-title" x="650" y="723">Actual provider usage</text><text class="node-line" x="650" y="748">Input / output · cache read / write</text><text class="node-line" x="650" y="768">Unreported fields remain null</text></g><text class="footer" x="1120" y="825" text-anchor="end">XiaoWang · v0.1.19</text></svg>