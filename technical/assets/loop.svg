<svg viewBox="0 0 1160 990" width="1160" height="990" role="img" aria-label="后台 Agent loop" xmlns="http://www.w3.org/2000/svg"><title>后台 Agent loop</title><desc>保存输入 → 接收补充 → 构建上下文 → 推理 → 执行与回写</desc><style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  .title { font-size: 27px; font-weight: 650; fill: #203453; letter-spacing: -.5px; }
  .subtitle { font-size: 15px; fill: #6b7c94; }
  .footer { font-size: 12px; fill: #8593a8; }
  .wire { fill: none; stroke: #6683be; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .wire.data { stroke: #5e9295; stroke-dasharray: 5 5; }
  .wire.direct { stroke: #a68155; stroke-dasharray: 2 5; }
  .edge-label { font-size: 12px; fill: #7a889f; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 7px; stroke-linejoin: round; }
  .node { cursor: pointer; outline: none; }
  .node rect { fill: #f7f9fd; stroke: #d8e2f1; stroke-width: 1.2; }
  .node .accent { fill: #2b59c3; stroke: none; }
  .node.teal rect { fill: #f2f8f7; stroke: #d0e4e0; }
  .node.teal .accent { fill: #428c83; }
  .node.orange rect { fill: #fdf8f2; stroke: #eddcc7; }
  .node.orange .accent { fill: #b77b38; }
  .node .node-title { fill: #263f63; font-size: 19px; font-weight: 600; }
  .node .node-line { fill: #71829b; font-size: 13px; }
  .node.selected rect, .node:focus-visible rect { stroke: #2b59c3; stroke-width: 2.5; fill: #edf3ff; }
  .node.selected .node-title { fill: #234fae; }
  .node.dim, .edge.dim { opacity: .2; }
  .node.selected.dim { opacity: 1; }
  .edge.active .wire { stroke: #2b59c3; stroke-width: 2.8; }
  .lane-label { font-size: 12px; fill: #71829b; font-weight: 550; }
  .node.slice .surface { fill: #dce7fc; stroke: #aac1ed; stroke-width: 1.3; }
  .node.slice .cap { fill: #edf3ff; stroke: #aac1ed; stroke-width: 1.3; }
  .node.slice.teal .surface { fill: #dbeeea; stroke: #a6cdc3; }
  .node.slice.teal .cap { fill: #f0f9f6; stroke: #a6cdc3; }
  .node.slice.orange .surface { fill: #f6e4ce; stroke: #dcb78b; }
  .node.slice.orange .cap { fill: #fdf5e9; stroke: #dcb78b; }
  .node.slice.selected .surface, .node.slice.selected .cap, .node.slice:focus-visible .cap { stroke: #2b59c3; stroke-width: 3; }
  .node.point circle { fill: #2b59c3; stroke: white; stroke-width: 4; }
  .node.point.orange circle { fill: #c78543; }
  .node.point.teal circle { fill: #428c83; }
  .node.point.selected circle, .node.point:focus-visible circle { stroke: #95b6ff; stroke-width: 6; }
  .node.prefix.selected .row-label, .node.prefix:focus-visible .row-label { fill: #2b59c3; font-weight: 650; }
  .segment-text { font-size: 16px; font-weight: 550; fill: #35527e; text-anchor: middle; }
  .point-label { font-size: 16px; font-weight: 650; fill: #3d587e; text-anchor: middle; }
  .annotation { font-size: 13px; fill: #71829b; }
</style><rect width="1160" height="990" fill="#ffffff"/><defs><marker id="loop-control" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#6683be" stroke-width="1.6"/></marker><marker id="loop-data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#5e9295" stroke-width="1.6"/></marker><marker id="loop-direct" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a68155" stroke-width="1.6"/></marker></defs><text x="40" y="48" class="title">后台 Agent loop</text><text x="40" y="78" class="subtitle">保存输入 → 接收补充 → 构建上下文 → 推理 → 执行与回写</text><path d="M40 105H1120" stroke="#e8edf5" stroke-width="1"/><g class="edge" data-from="input" data-to="route"><path class="wire control" d="M275 190H355" marker-end="url(#loop-control)"/><text class="edge-label" x="315" y="177">输入</text></g><g class="edge" data-from="route" data-to="queued"><path class="wire direct" d="M600 190H790" marker-end="url(#loop-direct)"/><text class="edge-label" x="695" y="177">显式排队</text></g><g class="edge" data-from="route" data-to="updates"><path class="wire control" d="M478 235V325" marker-end="url(#loop-control)"/><text class="edge-label" x="478" y="285">调度执行</text></g><g class="edge" data-from="queued" data-to="updates"><path class="wire direct" d="M945 235V275H554V325" marker-end="url(#loop-direct)"/><text class="edge-label" x="818" y="276">获得执行槽位</text></g><g class="edge" data-from="supplement" data-to="updates"><path class="wire data" d="M275 372H355" marker-end="url(#loop-data)"/><text class="edge-label" x="315" y="358">补充</text></g><g class="edge" data-from="updates" data-to="context"><path class="wire control" d="M478 420V495" marker-end="url(#loop-control)"/></g><g class="edge" data-from="context" data-to="model"><path class="wire control" d="M478 590V665" marker-end="url(#loop-control)"/></g><g class="edge" data-from="model" data-to="parse"><path class="wire control" d="M600 713H790" marker-end="url(#loop-control)"/><text class="edge-label" x="695" y="700">返回</text></g><g class="edge" data-from="parse" data-to="tool"><path class="wire control" d="M945 665V590" marker-end="url(#loop-control)"/><text class="edge-label" x="945" y="637">工具调用</text></g><g class="edge" data-from="tool" data-to="updates"><path class="wire control" d="M790 543H675V372H600" marker-end="url(#loop-control)"/><text class="edge-label" x="675" y="460">结果进入下一轮</text></g><g class="edge" data-from="parse" data-to="check"><path class="wire control" d="M945 760V830" marker-end="url(#loop-control)"/><text class="edge-label" x="945" y="807">普通答案</text></g><g class="edge" data-from="check" data-to="updates"><path class="wire data" d="M1100 878H1132V372H600" marker-end="url(#loop-data)"/><text class="edge-label" x="1090" y="405">有补充</text></g><g class="edge" data-from="check" data-to="done"><path class="wire control" d="M790 878H600" marker-end="url(#loop-control)"/><text class="edge-label" x="695" y="866">无补充</text></g><g class="edge" data-from="cancel" data-to="done"><path class="wire direct" d="M275 705H313V878H355" marker-end="url(#loop-direct)"/><text class="edge-label" x="306" y="815">释放槽位</text></g><g class="node blue " data-node="input" aria-label="用户请求"><rect x="40" y="145" width="235" height="90" rx="9"/><rect class="accent" x="40" y="165" width="3" height="50" rx="1.5"/><text class="node-title" x="60" y="178">用户请求</text><text class="node-line" x="60" y="203">文字消息或语音委派</text></g><g class="node blue " data-node="route" aria-label="受理与路由"><rect x="355" y="145" width="245" height="90" rx="9"/><rect class="accent" x="355" y="165" width="3" height="50" rx="1.5"/><text class="node-title" x="375" y="178">受理与路由</text><text class="node-line" x="375" y="203">保存输入 · 选择任务</text></g><g class="node orange" data-node="queued" aria-label="独立任务排队"><rect x="790" y="145" width="310" height="90" rx="9"/><rect class="accent" x="790" y="165" width="3" height="50" rx="1.5"/><text class="node-title" x="810" y="178">独立任务排队</text><text class="node-line" x="810" y="203">新任务编号 · 等待执行槽位</text></g><g class="node orange" data-node="supplement" aria-label="连续补充消息"><rect x="40" y="325" width="235" height="95" rx="9"/><rect class="accent" x="40" y="345" width="3" height="55" rx="1.5"/><text class="node-title" x="60" y="358">连续补充消息</text><text class="node-line" x="60" y="383">立即保存 · 关联原任务</text></g><g class="node blue" data-node="updates" aria-label="接收待处理补充"><rect x="355" y="325" width="245" height="95" rx="9"/><rect class="accent" x="355" y="345" width="3" height="55" rx="1.5"/><text class="node-title" x="375" y="358">接收待处理补充</text><text class="node-line" x="375" y="383">readUpdates() · 按事件编号去重</text></g><g class="node blue " data-node="context" aria-label="装配本次模型输入"><rect x="355" y="495" width="245" height="95" rx="9"/><rect class="accent" x="355" y="515" width="3" height="55" rx="1.5"/><text class="node-title" x="375" y="528">装配本次模型输入</text><text class="node-line" x="375" y="553">投影历史 · 资料目录 · 图像</text></g><g class="node blue " data-node="model" aria-label="调用后台 LLM"><rect x="355" y="665" width="245" height="95" rx="9"/><rect class="accent" x="355" y="685" width="3" height="55" rx="1.5"/><text class="node-title" x="375" y="698">调用后台 LLM</text><text class="node-line" x="375" y="723">system + messages + tools</text></g><g class="node blue " data-node="parse" aria-label="保存并解析模型输出"><rect x="790" y="665" width="310" height="95" rx="9"/><rect class="accent" x="790" y="685" width="3" height="55" rx="1.5"/><text class="node-title" x="810" y="698">保存并解析模型输出</text><text class="node-line" x="810" y="723">assistant_turn · toolCalls</text></g><g class="node blue " data-node="tool" aria-label="执行工具并写回结果"><rect x="790" y="495" width="310" height="95" rx="9"/><rect class="accent" x="790" y="515" width="3" height="55" rx="1.5"/><text class="node-title" x="810" y="528">执行工具并写回结果</text><text class="node-line" x="810" y="553">tool_result · artifact</text></g><g class="node blue " data-node="check" aria-label="普通答案的完成检查"><rect x="790" y="830" width="310" height="95" rx="9"/><rect class="accent" x="790" y="850" width="3" height="55" rx="1.5"/><text class="node-title" x="810" y="863">普通答案的完成检查</text><text class="node-line" x="810" y="888">检查模型执行期间的新补充</text></g><g class="node orange" data-node="cancel" aria-label="停止任务"><rect x="40" y="650" width="235" height="110" rx="9"/><rect class="accent" x="40" y="670" width="3" height="70" rx="1.5"/><text class="node-title" x="60" y="683">停止任务</text><text class="node-line" x="60" y="708">停止按钮 / cancel_task</text><text class="node-line" x="60" y="728">AbortSignal 传入执行路径</text></g><g class="node teal " data-node="done" aria-label="回写终态与结果"><rect x="355" y="830" width="245" height="95" rx="9"/><rect class="accent" x="355" y="850" width="3" height="55" rx="1.5"/><text class="node-title" x="375" y="863">回写终态与结果</text><text class="node-line" x="375" y="888">结果 · 产物 · 通知与下一任务</text></g><path class="wire control" d="M40 960h28"/><text class="footer" x="79" y="965">控制与模型往返</text><path class="wire data" d="M275 960h28"/><text class="footer" x="314" y="965">上下文与持久化</text><path class="wire direct" d="M510 960h28"/><text class="footer" x="549" y="965">直接工具 / 显式排队</text><text class="footer" x="1120" y="965" text-anchor="end">小王同学 · v0.1.17</text></svg>