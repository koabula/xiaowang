<svg viewBox="0 0 1160 850" width="1160" height="850" role="img" aria-label="上下文装配与记忆来源" xmlns="http://www.w3.org/2000/svg"><title>上下文装配与记忆来源</title><desc>持久化内容与工作区状态，经不同装配路径进入模型</desc><style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
