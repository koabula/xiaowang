<svg viewBox="0 0 1160 800" width="1160" height="800" role="img" aria-label="事件如何投影成模型输入" xmlns="http://www.w3.org/2000/svg"><title>事件如何投影成模型输入</title><desc>原始事件保存证据；投影清单记录采用的来源与渲染方式</desc><style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  .title { font-size: 27px; font-weight: 650; fill: #203453; letter-spacing: -.5px; }
  .subtitle { font-size: 15px; fill: #6b7c94; }
  .footer { font-size: 12px; fill: #8593a8; }
  .wire { fill: none; stroke: #6683be; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .wire.data { stroke: #5e9295; stroke-dasharray: 5 5; }
  .wire.direct { stroke: #a68155; stroke-dasharray: 2 5; }
  .edge-label { font-size: 12px; fill: #7a889f; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 7px; stroke-linejoin: round; }
  .node { cursor: pointer; outline: none; }
  .node rect { fill: #f7f9fd; stroke: #d8e2f1; stroke-width: 1.2; }
  .node .accent { fill: #2b59c3; stroke: none; }
  .node.teal rect { fill: #f2f8f7; stroke: #d0e4e0; }
  .node.teal .accent { fill: #428c83; }
  .node.orange rect { fill: #fdf8f2; stroke: #eddcc7; }
  .node.orange .accent { fill: #b77b38; }
  .node .node-title { fill: #263f63; font-size: 19px; font-weight: 600; }
  .node .node-line { fill: #71829b; font-size: 13px; }
  .node.selected rect, .node:focus-visible rect { stroke: #2b59c3; stroke-width: 2.5; fill: #edf3ff; }
  .node.selected .node-title { fill: #234fae; }
  .node.dim, .edge.dim { opacity: .2; }
  .node.selected.dim { opacity: 1; }
  .edge.active .wire { stroke: #2b59c3; stroke-width: 2.8; }
  .lane-label { font-size: 12px; fill: #71829b; font-weight: 550; }
  .node.slice .surface { fill: #dce7fc; stroke: #aac1ed; stroke-width: 1.3; }
  .node.slice .cap { fill: #edf3ff; stroke: #aac1ed; stroke-width: 1.3; }
  .node.slice.teal .surface { fill: #dbeeea; stroke: #a6cdc3; }
  .node.slice.teal .cap { fill: #f0f9f6; stroke: #a6cdc3; }
  .node.slice.orange .surface { fill: #f6e4ce; stroke: #dcb78b; }
  .node.slice.orange .cap { fill: #fdf5e9; stroke: #dcb78b; }
  .node.slice.selected .surface, .node.slice.selected .cap, .node.slice:focus-visible .cap { stroke: #2b59c3; stroke-width: 3; }
  .node.point circle { fill: #2b59c3; stroke: white; stroke-width: 4; }
  .node.point.orange circle { fill: #c78543; }
  .node.point.teal circle { fill: #428c83; }
  .node.point.selected circle, .node.point:focus-visible circle { stroke: #95b6ff; stroke-width: 6; }
  .node.prefix.selected .row-label, .node.prefix:focus-visible .row-label { fill: #2b59c3; font-weight: 650; }
  .segment-text { font-size: 16px; font-weight: 550; fill: #35527e; text-anchor: middle; }
  .point-label { font-size: 16px; font-weight: 650; fill: #3d587e; text-anchor: middle; }
  .annotation { font-size: 13px; fill: #71829b; }
</style><rect width="1160" height="800" fill="#ffffff"/><defs><marker id="projection-control" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#6683be" stroke-width="1.6"/></marker><marker id="projection-data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#5e9295" stroke-width="1.6"/></marker><marker id="projection-direct" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a68155" stroke-width="1.6"/></marker></defs><text x="40" y="48" class="title">事件如何投影成模型输入</text><text x="40" y="78" class="subtitle">原始事件保存证据；投影清单记录采用的来源与渲染方式</text><path d="M40 105H1120" stroke="#e8edf5" stroke-width="1"/><g class="edge" data-from="events" data-to="units"><path class="wire control" d="M350 228H425" marker-end="url(#projection-control)"/></g><g class="edge" data-from="units" data-to="ledger"><path class="wire control" d="M735 228H810" marker-end="url(#projection-control)"/></g><g class="edge" data-from="ledger" data-to="visual"><path class="wire control" d="M965 286V485" marker-end="url(#projection-control)"/><text class="edge-label" x="965" y="390">追加后装配</text></g><g class="edge" data-from="visual" data-to="budget"><path class="wire control" d="M810 543H735" marker-end="url(#projection-control)"/></g><g class="edge" data-from="budget" data-to="model"><path class="wire control" d="M425 543H350" marker-end="url(#projection-control)"/></g><g class="edge" data-from="model" data-to="events"><path class="wire data" d="M195 485V286" marker-end="url(#projection-data)"/><text class="edge-label" x="195" y="390">工具结果与新补充</text></g><g class="node teal " data-node="events" aria-label="01 · 读取当前任务的事件"><rect x="40" y="170" width="310" height="116" rx="9"/><rect class="accent" x="40" y="190" width="3" height="76" rx="1.5"/><text class="node-title" x="60" y="203">01 · 读取当前任务的事件</text><text class="node-line" x="60" y="228">按 bot 与任务归属筛选</text><text class="node-line" x="60" y="248">接收尚未处理的补充</text></g><g class="node blue " data-node="units" aria-label="02 · 构造完整消息单元"><rect x="425" y="170" width="310" height="116" rx="9"/><rect class="accent" x="425" y="190" width="3" height="76" rx="1.5"/><text class="node-title" x="445" y="203">02 · 构造完整消息单元</text><text class="node-line" x="445" y="228">转写采用最新修订</text><text class="node-line" x="445" y="248">调用 + 协议 + 对应结果成组</text></g><g class="node blue" data-node="ledger" aria-label="03 · 追加投影清单"><rect x="810" y="170" width="310" height="116" rx="9"/><rect class="accent" x="810" y="190" width="3" height="76" rx="1.5"/><text class="node-title" x="830" y="203">03 · 追加投影清单</text><text class="node-line" x="830" y="228">来源指纹去重 · 状态增量</text><text class="node-line" x="830" y="248">迟到修订作为新证据追加</text></g><g class="node blue " data-node="model" aria-label="06 · 调用与记录用量"><rect x="40" y="485" width="310" height="116" rx="9"/><rect class="accent" x="40" y="505" width="3" height="76" rx="1.5"/><text class="node-title" x="60" y="518">06 · 调用与记录用量</text><text class="node-line" x="60" y="543">原样回传 thinking / 签名</text><text class="node-line" x="60" y="563">请求哈希 · 实际 tokens · 缓存用量</text></g><g class="node blue " data-node="budget" aria-label="05 · 检查完整预算"><rect x="425" y="485" width="310" height="116" rx="9"/><rect class="accent" x="425" y="505" width="3" height="76" rx="1.5"/><text class="node-title" x="445" y="518">05 · 检查完整预算</text><text class="node-line" x="445" y="543">高水位触发确定性重投影</text><text class="node-line" x="445" y="563">仍超上限则保留输入并报错</text></g><g class="node teal " data-node="visual" aria-label="04 · 装配实际图像"><rect x="810" y="485" width="310" height="116" rx="9"/><rect class="accent" x="810" y="505" width="3" height="76" rx="1.5"/><text class="node-title" x="830" y="518">04 · 装配实际图像</text><text class="node-line" x="830" y="543">图片附件加载原件字节</text><text class="node-line" x="830" y="563">加入受理 / 补充关联画面</text></g><path class="wire control" d="M40 770h28"/><text class="footer" x="79" y="775">控制与模型往返</text><path class="wire data" d="M275 770h28"/><text class="footer" x="314" y="775">上下文与持久化</text><path class="wire direct" d="M510 770h28"/><text class="footer" x="549" y="775">直接工具 / 显式排队</text><text class="footer" x="1120" y="775" text-anchor="end">小王同学 · v0.1.18</text></svg>