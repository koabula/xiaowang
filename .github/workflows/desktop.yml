name: Desktop installers

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Existing successful build run to verify without rebuilding installers
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    if: ${{ !inputs.candidate_run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) throw new Error("Tag must match package.json version")'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install desktop test system libraries
        run: npx --no-install playwright install-deps chromium
      - name: Prepare virtual audio for desktop voice tests
        run: |
          sudo apt-get install -y pulseaudio dbus-x11 gnome-keyring
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=xiaowang_ci
          pactl set-default-sink xiaowang_ci
          pactl set-default-source xiaowang_ci.monitor
      - name: Exercise the desktop app with local model fixtures
        timeout-minutes: 5
        run: |
          dbus-run-session -- xvfb-run --auto-servernum bash -euc '
            export XDG_CURRENT_DESKTOP=GNOME
            printf "%s" "xiaowang-ci" | gnome-keyring-daemon --unlock --components=secrets
            node --test --test-reporter=tap --test-concurrency=1 --test-timeout=60000 e2e/*.test.mjs
          '
      - name: Exercise native focus and clipboard on a dedicated virtual desktop
        timeout-minutes: 5
        run: |
          dbus-run-session -- xvfb-run --auto-servernum bash -euc '
            export XDG_CURRENT_DESKTOP=GNOME
            printf "%s" "xiaowang-ci" | gnome-keyring-daemon --unlock --components=secrets
            node --test --test-reporter=tap --test-concurrency=1 --test-timeout=180000 e2e/native/*.test.mjs
          '

  package:
    name: Package ${{ matrix.name }}
    needs: check
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            arguments: --mac --x64 --arm64
          - name: Windows
            os: windows-latest
            arguments: --win --x64
          - name: Linux
            os: ubuntu-latest
            arguments: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_LINK: ${{ matrix.name == 'macOS' && secrets.MAC_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.name == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      WIN_CSC_LINK: ${{ matrix.name == 'Windows' && secrets.WIN_CSC_LINK || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ matrix.name == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installers
        shell: bash
        run: |
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK; fi
          if [ -z "${WIN_CSC_LINK:-}" ]; then unset WIN_CSC_LINK; fi
          npx --no-install electron-builder ${{ matrix.arguments }} --publish never
      - name: Verify macOS signatures and first launch from ZIP and DMG
        if: matrix.name == 'macOS'
        env:
          XIAOWANG_MAC_RELEASE_DIR: release
        run: node --test --test-concurrency=1 --test-timeout=180000 e2e/native/mac-release.test.mjs
      - name: Write SHA-256 checksums
        run: node desktop/scripts/checksums.mjs
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: XiaoWang-${{ matrix.name }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS.txt

  candidate-acceptance:
    name: Accept candidate ${{ matrix.name }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_run_id != '' }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-latest
            artifact: macOS
          - name: macOS-Intel
            os: macos-15-intel
            artifact: macOS
          - name: Windows
            os: windows-latest
            artifact: Windows
          - name: Linux
            os: ubuntu-latest
            artifact: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          pattern: XiaoWang-${{ matrix.artifact }}-*
          merge-multiple: true
          path: candidate
      - name: Download original previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/download-previous-installers.mjs
      - name: Prepare isolated Linux desktop
        if: runner.os == 'Linux'
        run: |
          npx --no-install playwright install-deps chromium
          sudo apt-get install -y dbus-x11 gnome-keyring
      - name: Verify actual installation, update and retained data
        timeout-minutes: 12
        shell: bash
        env:
          XIAOWANG_CANDIDATE_DIR: candidate
          XIAOWANG_PREVIOUS_DIR: previous
          XIAOWANG_QA_REPORT_DIR: qa-report
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            dbus-run-session -- xvfb-run --auto-servernum bash -euc '
              export XDG_CURRENT_DESKTOP=GNOME
              printf "%s" "xiaowang-ci" | gnome-keyring-daemon --unlock --components=secrets
              node scripts/verify-candidate-install.mjs
            '
          else
            node scripts/verify-candidate-install.mjs
          fi
      - name: Retain acceptance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Candidate-acceptance-${{ matrix.name }}-${{ github.run_id }}
          path: qa-report/
          retention-days: 14

  release:
    name: Publish complete GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: XiaoWang-*
          path: release-publish
          merge-multiple: true
      - name: Recompute checksums for all platforms
        run: node desktop/scripts/checksums.mjs release-publish
      - name: Publish installers and update manifests together
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes
          gh release upload "$RELEASE_TAG" release-publish/* --clobber
          node desktop/scripts/release-notes.ts "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false --latest
