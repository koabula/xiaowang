name: Desktop installers

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) throw new Error("Tag must match package.json version")'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install desktop test system libraries
        run: npx --no-install playwright install-deps chromium
      - name: Prepare virtual audio for desktop voice tests
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=xiaowang_ci
          pactl set-default-sink xiaowang_ci
          pactl set-default-source xiaowang_ci.monitor
      - name: Exercise the desktop app with local model fixtures
        timeout-minutes: 5
        run: xvfb-run --auto-servernum node --test --test-concurrency=1 --test-reporter=tap --test-timeout=60000 e2e/*.test.mjs

  package:
    name: Package ${{ matrix.name }}
    needs: check
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            arguments: --mac --x64 --arm64
          - name: Windows
            os: windows-latest
            arguments: --win --x64
          - name: Linux
            os: ubuntu-latest
            arguments: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_LINK: ${{ matrix.name == 'macOS' && secrets.MAC_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.name == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      WIN_CSC_LINK: ${{ matrix.name == 'Windows' && secrets.WIN_CSC_LINK || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ matrix.name == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installers
        shell: bash
        run: |
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK; fi
          if [ -z "${WIN_CSC_LINK:-}" ]; then unset WIN_CSC_LINK; fi
          npx --no-install electron-builder ${{ matrix.arguments }} --publish never
      - name: Verify macOS signatures and first launch from ZIP and DMG
        if: matrix.name == 'macOS'
        env:
          XIAOWANG_MAC_RELEASE_DIR: release
        run: node --test --test-concurrency=1 --test-timeout=180000 e2e/mac-release.test.mjs
      - name: Write SHA-256 checksums
        run: node desktop/scripts/checksums.mjs
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: XiaoWang-${{ matrix.name }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS.txt

  release:
    name: Publish complete GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: XiaoWang-*
          path: release-publish
          merge-multiple: true
      - name: Recompute checksums for all platforms
        run: node desktop/scripts/checksums.mjs release-publish
      - name: Publish installers and update manifests together
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes
          gh release upload "$RELEASE_TAG" release-publish/* --clobber
          node desktop/scripts/release-notes.ts "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false --latest
