name: Desktop installers

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install desktop test system libraries
        run: npx --no-install playwright install-deps chromium
      - name: Exercise the desktop app with local model fixtures
        run: xvfb-run --auto-servernum npm run test:desktop

  package:
    name: Package ${{ matrix.name }}
    needs: check
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            arguments: --mac --x64 --arm64
          - name: Windows
            os: windows-latest
            arguments: --win --x64
          - name: Linux
            os: ubuntu-latest
            arguments: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_LINK: ${{ matrix.name == 'macOS' && secrets.MAC_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.name == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      WIN_CSC_LINK: ${{ matrix.name == 'Windows' && secrets.WIN_CSC_LINK || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ matrix.name == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installers
        run: npx --no-install electron-builder ${{ matrix.arguments }} --publish never
      - name: Write SHA-256 checksums
        run: node desktop/scripts/checksums.mjs
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: XiaoWang-${{ matrix.name }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/SHA256SUMS.txt
